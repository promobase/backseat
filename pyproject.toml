[project]
name = "backseat"
version = "0.0.1"
description = "Copilot for your social media platforms & ads"
authors = [{ name = "Ray Li", email = "li.ruize09@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
dependencies = [
    "anthropic>=0.54.0",
    "fastmcp>=2.8.1",
    "fire>=0.7.0",
    "google-genai>=1.20.0",
    "mcp[cli]>=1.9.4",
    "openai>=1.86.0",
    "openai-agents>=0.0.17",
    "playwright>=1.52.0",
]

[project.urls]
Homepage = "https://rayli09.github.io/backseat/"
Repository = "https://github.com/rayli09/backseat"
Documentation = "https://rayli09.github.io/backseat/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",

    "mypy>=0.991",
    "ruff>=0.11.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backseat"]

[tool.mypy]
files = ["backseat"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.uv.sources]
openai-agents = { git = "https://github.com/openai/openai-agents-python" }
