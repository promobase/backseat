site_name: backseat
repo_url: https://github.com/rayli09/backseat
site_url: https://rayli09.github.io/backseat
site_description: Copilot for your social media platforms & ads
site_author: Ray Li
edit_uri: edit/main/docs/
repo_name: rayli09/backseat
copyright: Maintained by <a href="https://rayli09.com">rayli09</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["backseat"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rayli09/backseat
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/backseat

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
